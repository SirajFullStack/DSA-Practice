  <g font-family="Arial, sans-serif" font-size="16" fill="#222">
    <text x="40" y="270" font-weight="bold">Inorder (Left, Root, Right):</text>
    <text x="300" y="270">20 30 40 50 60 70 80</text>
    <text x="40" y="310" font-weight="bold">Preorder (Root, Left, Right):</text>
    <text x="300" y="310">50 30 20 40 70 60 80</text>
    <text x="40" y="350" font-weight="bold">Postorder (Left, Right, Root):</text>
