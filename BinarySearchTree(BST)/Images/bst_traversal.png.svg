<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="600" height="400" fill="#ffffff"/>
  <g stroke="#555" stroke-width="2">
    <line x1="300" y1="50" x2="200" y2="120"/>
    <line x1="300" y1="50" x2="400" y2="120"/>
    <line x1="200" y1="120" x2="140" y2="190"/>
    <line x1="200" y1="120" x2="260" y2="190"/>
    <line x1="400" y1="120" x2="340" y2="190"/>
    <line x1="400" y1="120" x2="460" y2="190"/>
  </g>
  <g fill="#2e9e6b" stroke="#1d6b47" stroke-width="2">
    <circle cx="300" cy="50" r="24"/>
    <circle cx="200" cy="120" r="24"/>
    <circle cx="400" cy="120" r="24"/>
    <circle cx="140" cy="190" r="24"/>
    <circle cx="260" cy="190" r="24"/>
    <circle cx="340" cy="190" r="24"/>
    <circle cx="460" cy="190" r="24"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="300" y="56">50</text>
    <text x="200" y="126">30</text>
